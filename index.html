<script>
  window.addEventListener('error', function(e) {
    var el = document.getElementById('root');
    if (!el) return;
    el.innerHTML = '<div style="padding:20px;font-family:monospace;white-space:pre-wrap;color:#dc2626;font-size:13px;line-height:1.6;">🔴 에러 발생 (이 화면 캡처해서 보내주세요)\n\n' +
      (e.message||'(메시지 없음)') + '\n' +
      (e.filename ? ('파일: ' + e.filename + ':' + e.lineno + ':' + e.colno) : '') + '\n\n' +
      (e.error && e.error.stack ? e.error.stack : '(스택 없음)') + '</div>';
  });
  window.addEventListener('unhandledrejection', function(e) {
    var el = document.getElementById('root');
    if (!el) return;
    el.innerHTML = '<div style="padding:20px;font-family:monospace;white-space:pre-wrap;color:#dc2626;font-size:13px;line-height:1.6;">🔴 Promise 에러 (이 화면 캡처해서 보내주세요)\n\n' +
      (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) + '</div>';
  });
</script>

function parseD(dStr) {
  if (!dStr) return null;
  const [m, d] = dStr.split('/').map(Number);
  if (!m || !d) return null;
  const now = new Date();
  let year = now.getFullYear();
  let dt = new Date(year, m - 1, d);
  if (dt > now) dt = new Date(year - 1, m - 1, d);
  return dt;
}
function daysAgo(dStr) { const dt = parseD(dStr); if (!dt) return 999; return Math.floor((new Date() - dt) / 86400000); }
function freshColor(dStr) { const d = daysAgo(dStr); if (d<=10) return '#22c55e'; if (d<=21) return '#eab308'; return '#ef4444'; }
function adjustedForRanking(price, dStr) { const days = daysAgo(dStr); const penalty = days > 21 ? 0.15 : days > 10 ? 0.05 : 0; return price * (1 + penalty); }
function rankVendors(prices) {
  const entries = Object.entries(prices).filter(([,p]) => p && p.v != null);
  entries.sort((a,b) => adjustedForRanking(a[1].v, a[1].d) - adjustedForRanking(b[1].v, b[1].d));
  return entries.map(([vendor]) => vendor);
}
function rankVendorsFiltered(prices, allowedIds) {
  const entries = Object.entries(prices).filter(([vid,p]) => p && p.v != null && allowedIds.includes(vid));
  entries.sort((a,b) => adjustedForRanking(a[1].v, a[1].d) - adjustedForRanking(b[1].v, b[1].d));
  return entries.map(([vendor]) => vendor);
}
function fmtQty(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, ''); }
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}
function tokensClose(a, b) {
  if (a === b) return true;
  if (a.length < 5 || b.length < 5) return false; // 짧은 단어는 오타 허용 시 오탐 위험이 커서 정확히 일치해야만 인정
  const d = levenshtein(a, b);
  return d <= 2 && d / Math.max(a.length, b.length) <= 0.3;
}
function fuzzyMatchItem(name, items) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
  const target = norm(name);
  let best = null, bestScore = 0;
  for (const it of items) {
    const cand = norm(it.name);
    if (cand === target) return it;
    const tTokens = new Set(name.toLowerCase().split(/\s+/).filter(w=>w.length>1));
    const cTokens = new Set(it.name.toLowerCase().split(/\s+/).filter(w=>w.length>1));
    let overlap = 0; for (const t of tTokens) { if (cTokens.has(t)) { overlap++; continue; } for (const c of cTokens) { if (tokensClose(t, c)) { overlap++; break; } } }
    if (overlap < 2) continue; // 겹치는 단어가 1개뿐이면 오탐 위험이 커서 제외 (예: "radish" 하나로 "Korean Radish"에 잘못 매칭되는 것 방지)
    const score = overlap / Math.max(Math.min(tTokens.size, cTokens.size), 1);
    if (score > bestScore) { bestScore = score; best = it; }
  }
  return bestScore >= 0.5 ? best : null;
}
const SUPPORTED_IMAGE_TYPES = ['image/jpeg','image/jpg','image/png','image/gif','image/webp'];
function buildFileContentBlock(file, b64) {
  const t = (file.type || '').toLowerCase();
  if (t === 'application/pdf') return { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64 } };
  if (SUPPORTED_IMAGE_TYPES.includes(t) || !t) return { type: 'image', source: { type: 'base64', media_type: t || 'image/jpeg', data: b64 } };
  return null; // 지원 안 되는 형식 (예: HEIC 원본 등)
}
function resolveMatch(name, itemsList, aliases) {
  const key = name.trim().toLowerCase();
  if (aliases && aliases[key]) {
    const found = itemsList.find(it => it.id === aliases[key]);
    if (found) return found;
  }
  return fuzzyMatchItem(name, itemsList);
}

                block,
                { type: 'text', text: `한국 BBQ 레스토랑(Handam BBQ)의 외부 벤더 인보이스입니다. 이 사진은 우리 가게가 다른 거래처(EJ, KOT, Sysco, Ken's, H Mart 등)로부터 받은 매입 인보이스이며, 반드시 가격이 적혀 있어야 합니다.
매우 중요: 사진 상단에 "HANDAM BBQ" 로고나 이름이 보여도 그건 우리 가게 자체 문서(주문지, 체크리스트 등)의 letterhead일 뿐이니 절대 벤더 이름으로 인식하지 마세요. "HANDAM"이나 우리 가게 이름을 vendor_id나 new_vendor로 쓰는 것은 금지입니다. 만약 사진에 실제 외부 벤더의 이름/로고나 가격 정보가 전혀 없다면(즉 우리 가게 자체 주문지처럼 보이면), items를 빈 배열로 응답하세요 — 절대 추측해서 벤더나 가격을 만들어내지 마세요.
## 벤더: ${vendorList}
## 품목: ${itemCatalog}
규칙: 벤더id 매칭(신규면 new_vendor, 단 위 금지 규칙 준수), 품목매칭(matched=true, 기존명 사용/아니면 false), 가격은 /lb 우선.
JSON만: {"vendor_id":"id|null","new_vendor":"이름|null","date":"M/D","invoice_no":"번호|null","items":[{"matched":true,"name":"...","price":7.49,"unit":"/lb"}]}` }

          }
          const data = await resp.json();
          const text = data.content?.filter(c => c.type === 'text').map(c => c.text).join('') || '';
          if (!text) { results.push({ error: '응답 텍스트 없음' }); continue; }
          const parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
          const looksLikeSelf = (s) => !!s && s.toLowerCase().replace(/[^a-z]/g, '').includes('handam');
          if (looksLikeSelf(parsed.new_vendor) || looksLikeSelf(parsed.vendor_id)) {
            results.push({ error: '이 사진은 벤더 인보이스가 아니라 우리 가게 자체 문서로 보여요 (Handam BBQ 로고를 벤더로 착각함). "오더페이퍼 업로드"를 사용해주세요.' });

          }
          results.push(parsed);
        } catch (e) { results.push({ error: e.message || String(e) }); }
      }
    } catch (outerErr) {
      setUploading(false); setUploadProgress('');
      setUploadError('예상치 못한 오류: ' + (outerErr.message || String(outerErr)));
      return;
    }
    setUploading(false); setUploadProgress('');
    const valid = results.filter(r => !r.error);
    const errored = results.filter(r => r.error);
    if (valid.length === 0) {
      setUploadError(`인식 실패 (${errored.length}장). 사진을 다시 찍거나 조명/흔들림을 확인해주세요.\n` + errored.map(e=>'· '+e.error).join('\n'));
      return;
    }
    function fuzzyFind(name) {
      const norm = s => s.toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
      const target = norm(name);
      let best = null, bestScore = 0;
      for (const it of items) {
        const cand = norm(it.name);
        if (cand === target) return { item: it, score: 1 };
        const tTokens = new Set(name.toLowerCase().split(/\s+/).filter(w=>w.length>1));
        const cTokens = new Set(it.name.toLowerCase().split(/\s+/).filter(w=>w.length>1));
        let overlap = 0; for (const t of tTokens) { if (cTokens.has(t)) { overlap++; continue; } for (const c of cTokens) { if (tokensClose(t, c)) { overlap++; break; } } }
        if (overlap < 2) continue;
        const score = overlap / Math.max(Math.min(tTokens.size, cTokens.size), 1);
        if (score > bestScore) { bestScore = score; best = { item: it, score }; }
      }
      return bestScore >= 0.5 ? best : null;
    }
    const matchedItems = [];
    for (const inv of valid) {
      for (const it of inv.items) {
        const hit = it.matched ? fuzzyFind(it.name) : null;
        if (hit) {
          const found = hit.item;
          matchedItems.push({ key: found.id + '__' + (inv.vendor_id || inv.new_vendor), itemId: found.id, itemName: found.name,

            existingPrices: {}, isNew: true, include: true });
        }
      }
    }
    if (matchedItems.length === 0) { setUploadError('인보이스는 인식됐지만 추출된 품목이 없어요.'); return; }
    setPending({ invoices: valid, matchedItems });

    return rows;

        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 250, padding: 20 }}>
          <div style={{ background: '#fff', borderRadius: 16, padding: 20, width: '100%', maxWidth: 320 }}>
            <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>{addPanelItem.item.name}</div>
            <div style={{ fontSize: 12, color: '#666', marginBottom: 14 }}>{vmap[addPanelItem.vendorId]?.name}에서 담기</div>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16, marginBottom: 18 }}>
              <button onClick={() => panelQty(-1)} style={{ width: 42, height: 42, borderRadius: '50%', border: '1px solid #ddd', background: '#f9fafb', fontSize: 18, fontWeight: 700, cursor: 'pointer' }}>−</button>
              <span style={{ fontSize: 22, fontWeight: 700, minWidth: 46, textAlign: 'center' }}>{fmtQty(addPanelItem.qty)}</span>
              <button onClick={() => panelQty(1)} style={{ width: 42, height: 42, borderRadius: '50%', border: '1px solid #ddd', background: '#f9fafb', fontSize: 18, fontWeight: 700, cursor: 'pointer' }}>＋</button>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={() => setAddPanelItem(null)} style={{ flex: 1, padding: 11, borderRadius: 9, border: '1px solid #ddd', background: '#f9fafb', fontSize: 13, cursor: 'pointer' }}>취소</button>
              <button onClick={confirmAdd} style={{ flex: 2, padding: 11, borderRadius: 9, border: 'none', background: '#111', color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>담기</button>
            </div>
          </div>
        </div>
      )}

      {uploading && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200 }}>
          <div style={{ background: '#fff', borderRadius: 14, padding: 26, textAlign: 'center', maxWidth: 260 }}>
            <div style={{ fontWeight: 700, fontSize: 14 }}>{uploadProgress}</div>
          </div>
        </div>
      )}

      {/* ═══ 오더페이퍼 인식 결과 확인 ═══ */}
      {orderPending && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', zIndex: 200 }}>
          <div style={{ background: '#fff', width: '100%', maxWidth: 560, borderRadius: '18px 18px 0 0', padding: '16px 14px', maxHeight: '88vh', overflow: 'auto' }}>
            <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 2 }}>오더페이퍼 인식 결과</div>
            <div style={{ fontSize: 11, color: '#888', marginBottom: 12 }}>수량 확인 후 적용하면 오늘 주문 가능한 최저가 벤더로 자동 담겨요.</div>
            {orderPending.matchedItems.map(m => (
              <div key={m.key} style={{ border:'1px solid #eee', borderRadius:9, padding:'9px 11px', marginBottom:6, opacity: m.include?1:0.5 }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <input type="checkbox" checked={m.include} onChange={()=>toggleOrderInclude(m.key)} />
                  <span style={{ flex:1, fontSize:12.5 }}>{m.itemName}</span>
                  <input value={m.qty} type="number" step="0.5" onChange={e=>updateOrderQty(m.key, e.target.value)}
                    style={{ width:50, border:'1px solid #ccc', borderRadius:5, padding:'4px 6px', fontSize:12, fontWeight:700, textAlign:'center' }} />
                </div>
                {m.alreadySysco && (
                  <div style={{ fontSize:10, color:'#dc2626', marginTop:4, paddingLeft:24 }}>⚠️ 오늘 Sysco로 이미 주문됨 — 체크 해제된 상태 (추가로 더 필요하면 체크)</div>
                )}
              </div>
            ))}
            {orderPending.unmatched.length > 0 && (
              <div style={{ marginTop:8 }}>
                <div style={{ fontSize:11, color:'#92400e', fontWeight:700, marginBottom:6 }}>매칭 안 됨 — 검색해서 연결하거나, 없으면 새 품목으로 추가:</div>
                {orderPending.unmatched.map((u,i) => {
                  const q = (orderSearchText[i] || '').trim().toLowerCase();
                  const results = q ? items.filter(it => it.name.toLowerCase().includes(q)).slice(0, 20) : [];
                  const exactExists = q && items.some(it => it.name.toLowerCase() === q);
                  return (
                    <div key={i} style={{ background:'#fffbeb', border:'1px solid #fde68a', borderRadius:9, padding:'8px 10px', marginBottom:6 }}>
                      <div style={{ fontSize:12, marginBottom:6 }}>{u.name} <span style={{color:'#92400e',fontWeight:700}}>× {u.qty}</span></div>
                      <input value={orderSearchText[i]||''} onChange={e=>setOrderSearchText(p=>({...p,[i]:e.target.value}))}
                        placeholder="검색하거나 새 이름 직접 입력..."
                        style={{ width:'100%', boxSizing:'border-box', padding:'7px 9px', borderRadius:6, border:'1px solid #ddd', fontSize:12, background:'#fff' }} />
                      {results.length > 0 && (
                        <div style={{ maxHeight:160, overflowY:'auto', border:'1px solid #eee', borderRadius:6, marginTop:5, background:'#fff' }}>
                          {results.map(it => (
                            <div key={it.id} onClick={()=>linkOrderUnmatched(i, it.id)}
                              style={{ padding:'7px 9px', fontSize:12, borderBottom:'1px solid #f5f5f5', cursor:'pointer' }}>
                              <span style={{color:'#999',fontSize:10}}>{CAT_LABEL[it.cat]}</span> · {it.name}
                            </div>
                          ))}
                        </div>
                      )}
                      {q && !exactExists && (
                        <button onClick={()=>addNewFromOrderUnmatched(i, orderSearchText[i])}
                          style={{ width:'100%', marginTop:5, padding:'7px 0', borderRadius:6, border:'1px dashed #d97706', background:'#fff', color:'#92400e', fontSize:11.5, fontWeight:700, cursor:'pointer' }}>
                          + "{orderSearchText[i]}" 새 품목으로 추가
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
            <div style={{ display: 'flex', gap: 8, marginTop: 12, position: 'sticky', bottom: 0, background: '#fff', paddingTop: 8 }}>
              <button onClick={() => setOrderPending(null)} style={{ flex: 1, padding: 12, borderRadius: 9, border: '1px solid #ddd', background: '#f9fafb', fontSize: 13, cursor: 'pointer' }}>취소</button>
              <button onClick={applyOrderPaper} style={{ flex: 2, padding: 12, borderRadius: 9, border: 'none', background: '#111', color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>
                {orderPending.matchedItems.filter(m=>m.include).length}개 오늘오더에 반영
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ═══ Sysco 인식 결과 확인 ═══ */}
      {syscoPending && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', zIndex: 200 }}>
          <div style={{ background: '#fff', width: '100%', maxWidth: 560, borderRadius: '18px 18px 0 0', padding: '16px 14px', maxHeight: '88vh', overflow: 'auto' }}>
            <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 2 }}>Sysco 주문완료 확인 ({syscoPending.date})</div>
            <div style={{ fontSize: 11, color: '#888', marginBottom: 12 }}>확인 항목은 오늘 오더 목록에서 "Sysco 완료"로 표시되고 장바구니에는 안 들어가요.</div>
            {syscoPending.matchedItems.map(m => (
              <div key={m.key} style={{ display:'flex', alignItems:'center', gap:8, border:'1px solid #eee', borderRadius:9, padding:'9px 11px', marginBottom:6, opacity: m.include?1:0.5 }}>
                <input type="checkbox" checked={m.include} onChange={()=>toggleSyscoInclude(m.key)} />
                <span style={{ flex:1, fontSize:12.5 }}>{m.itemName}</span>
                <span style={{ fontSize:12, fontWeight:700, color:'#666' }}>× {fmtQty(m.qty)}</span>
              </div>
            ))}
            {syscoPending.unmatched.length > 0 && (
              <div style={{ marginTop:8 }}>
                <div style={{ fontSize:11, color:'#92400e', fontWeight:700, marginBottom:6 }}>매칭 안 됨 — 검색해서 연결하거나, 없으면 새 품목으로 추가:</div>
                {syscoPending.unmatched.map((u,i) => {
                  const q = (syscoSearchText[i] || '').trim().toLowerCase();
                  const results = q ? items.filter(it => it.name.toLowerCase().includes(q)).slice(0, 20) : [];
                  const exactExists = q && items.some(it => it.name.toLowerCase() === q);
                  return (
                    <div key={i} style={{ background:'#fffbeb', border:'1px solid #fde68a', borderRadius:9, padding:'8px 10px', marginBottom:6 }}>
                      <div style={{ fontSize:12, marginBottom:6 }}>{u.name} <span style={{color:'#92400e',fontWeight:700}}>× {u.qty}</span></div>
                      <input value={syscoSearchText[i]||''} onChange={e=>setSyscoSearchText(p=>({...p,[i]:e.target.value}))}
                        placeholder="검색하거나 새 이름 직접 입력..."
                        style={{ width:'100%', boxSizing:'border-box', padding:'7px 9px', borderRadius:6, border:'1px solid #ddd', fontSize:12, background:'#fff' }} />
                      {results.length > 0 && (
                        <div style={{ maxHeight:160, overflowY:'auto', border:'1px solid #eee', borderRadius:6, marginTop:5, background:'#fff' }}>
                          {results.map(it => (
                            <div key={it.id} onClick={()=>linkSyscoUnmatched(i, it.id)}
                              style={{ padding:'7px 9px', fontSize:12, borderBottom:'1px solid #f5f5f5', cursor:'pointer' }}>
                              <span style={{color:'#999',fontSize:10}}>{CAT_LABEL[it.cat]}</span> · {it.name}
                            </div>
                          ))}
                        </div>
                      )}
                      {q && !exactExists && (
                        <button onClick={()=>addNewFromSyscoUnmatched(i, syscoSearchText[i])}
                          style={{ width:'100%', marginTop:5, padding:'7px 0', borderRadius:6, border:'1px dashed #d97706', background:'#fff', color:'#92400e', fontSize:11.5, fontWeight:700, cursor:'pointer' }}>
                          + "{syscoSearchText[i]}" 새 품목으로 추가
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
            <div style={{ display: 'flex', gap: 8, marginTop: 12, position: 'sticky', bottom: 0, background: '#fff', paddingTop: 8 }}>
              <button onClick={() => setSyscoPending(null)} style={{ flex: 1, padding: 12, borderRadius: 9, border: '1px solid #ddd', background: '#f9fafb', fontSize: 13, cursor: 'pointer' }}>취소</button>
              <button onClick={applySyscoOrder} style={{ flex: 2, padding: 12, borderRadius: 9, border: 'none', background: '#1d4ed8', color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>
                {syscoPending.matchedItems.filter(m=>m.include).length}개 완료 표시
              </button>
            </div>
          </div>
        </div>
      )}

      {pending && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', zIndex: 200 }}>
          <div style={{ background: '#fff', width: '100%', maxWidth: 560, borderRadius: '18px 18px 0 0', padding: '16px 14px', maxHeight: '88vh', overflow: 'auto' }}>
            <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 2 }}>인식 결과 확인</div>
            <div style={{ fontSize: 11, color: '#888', marginBottom: 12 }}>새 가격이 반영되면 순위가 어떻게 바뀌는지 확인하세요.</div>
            {pending.matchedItems.map((m) => {
              const vidForCalc = m.vendorId || 'NEW_' + m.newVendorName;
              const merged = { ...m.existingPrices, [vidForCalc]: { v: m.newPrice, u: m.newUnit, d: m.date } };
              const ranked = rankVendors(merged);
              const rankIdx = ranked.indexOf(vidForCalc);
              return (
                <div key={m.key} style={{ border: '1px solid #eee', borderRadius: 10, padding: '10px 12px', marginBottom: 8, background: m.include ? '#fff' : '#fafafa', opacity: m.include ? 1 : 0.5 }}>
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8, marginBottom: 6 }}>
                    <input type="checkbox" checked={m.include} onChange={() => toggleInclude(m.key)} style={{ marginTop: 3 }} />
                    <input value={m.itemName} onChange={e => updateMatchedName(m.key, e.target.value)} style={{ flex:1, border: '1px solid #e0e0e0', borderRadius: 5, padding: '4px 7px', fontSize: 12, fontWeight: 600, boxSizing:'border-box' }} />
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6, paddingLeft: 24, flexWrap:'wrap' }}>
                    <span style={{ fontSize: 11, background: m.newVendorName ? '#dbeafe' : (vmap[m.vendorId]?.color || '#eee'), padding: '2px 8px', borderRadius: 6, fontWeight: 700 }}>
                      {m.newVendorName ? `신규벤더: ${m.newVendorName}` : vmap[m.vendorId]?.name}
                    </span>
                    <span style={{ fontSize: 9, color: '#888' }}>{m.date}</span>
                    {rankIdx === 0 && !m.isNew && <span style={{ fontSize: 9, color: '#16a34a', fontWeight: 700 }}>최저가</span>}
                    {rankIdx > 0 && <span style={{ fontSize: 9, color: '#ea580c', fontWeight: 700 }}>{rankIdx+1}위</span>}
                    <input value={m.newPrice} type="number" step="0.01" onChange={e => updateMatchedPrice(m.key, e.target.value)}
                      style={{ width: 58, border: '1px solid #ccc', borderRadius: 5, padding: '3px 5px', fontSize: 12, fontWeight: 700, textAlign: 'right', marginLeft:'auto' }} />
                    <span style={{ fontSize: 10, color: '#888' }}>{m.newUnit}</span>
                  </div>
                  {!m.isNew && (
                    <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', paddingLeft: 24 }}>
                      {ranked.map((vid, idx) => {
                        const p = merged[vid]; const isNewOne = vid === vidForCalc;
                        const name = isNewOne ? (m.newVendorName || vmap[vid]?.name) : vmap[vid]?.name;
                        return <span key={vid} style={{ fontSize: 10, padding: '2px 7px', borderRadius: 8, background: isNewOne ? '#fef9c3' : '#f3f4f6', fontWeight: isNewOne ? 700 : 400 }}>{idx+1}. {name} ${p.v.toFixed(2)}{isNewOne && ' (new)'}</span>;
                      })}
                    </div>
                  )}
                </div>
              );
            })}
            <div style={{ display: 'flex', gap: 8, marginTop: 10, position: 'sticky', bottom: 0, background: '#fff', paddingTop: 8 }}>
              <button onClick={() => setPending(null)} style={{ flex: 1, padding: 12, borderRadius: 9, border: '1px solid #ddd', background: '#f9fafb', fontSize: 13, cursor: 'pointer' }}>취소</button>
              <button onClick={applyAll} style={{ flex: 2, padding: 12, borderRadius: 9, border: 'none', background: '#111', color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>
                {pending.matchedItems.filter(m=>m.include).length}개 적용
              </button>
            </div>
          </div>
        </div>
      )}

      {showSettings && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 300, padding: 20 }}>
          <div style={{ background: '#fff', borderRadius: 16, padding: 20, width: '100%', maxWidth: 380 }}>
            <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>설정</div>
            <div style={{ fontSize: 11, color: '#888', marginBottom: 14, lineHeight: 1.5 }}>
              사진 인식(업로드) 기능을 쓰려면 Anthropic API 키가 필요해. console.anthropic.com에서 발급받은 키를 여기 붙여넣으면 이 브라우저에만 저장되고, 인식할 때 Anthropic으로 직접 전송돼.
              <br/><b style={{color:'#dc2626'}}>이 파일을 공개된 곳에 올릴 땐 절대 키를 파일에 직접 넣지 말고, 항상 이 설정창으로 각자 입력하게 해줘.</b>
            </div>
            <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 4 }}>API 키</div>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-..."
              style={{ width:'100%', boxSizing:'border-box', padding:'9px 10px', borderRadius:8, border:'1px solid #ddd', fontSize:12.5, marginBottom:12 }} />
            <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 4 }}>모델</div>
            <input value={model} onChange={e=>setModel(e.target.value)} placeholder="claude-haiku-4-5-20251001"
              style={{ width:'100%', boxSizing:'border-box', padding:'9px 10px', borderRadius:8, border:'1px solid #ddd', fontSize:12.5, marginBottom:4 }} />
            <div style={{ fontSize: 10, color: '#aaa', marginBottom: 16 }}>기본값 claude-haiku-4-5-20251001 (Sysco/인쇄된 인보이스 인식용, 저렴하고 충분히 정확함).</div>
            <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 4 }}>모델 (손글씨 오더페이퍼 전용)</div>
            <input value={handwritingModel} onChange={e=>setHandwritingModel(e.target.value)} placeholder="claude-sonnet-5"
              style={{ width:'100%', boxSizing:'border-box', padding:'9px 10px', borderRadius:8, border:'1px solid #ddd', fontSize:12.5, marginBottom:4 }} />
            <div style={{ fontSize: 10, color: '#aaa', marginBottom: 16 }}>손글씨 인식은 더 어려운 작업이라 정확도 높은 모델을 따로 씀. 계속 틀리면 claude-opus-4-8로 올려봐도 돼.</div>
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={()=>setShowSettings(false)} style={{ flex:1, padding:11, borderRadius:9, border:'1px solid #ddd', background:'#f9fafb', fontSize:13, cursor:'pointer' }}>닫기</button>
              <button onClick={()=>{ setUploadError(null); setShowSettings(false); }} style={{ flex:1, padding:11, borderRadius:9, border:'none', background:'#111', color:'#fff', fontSize:13, fontWeight:700, cursor:'pointer' }}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

  (function() {
    var source = document.getElementById('app-source').textContent;
    var output = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]] }).code;
    var s = document.createElement('script');
    s.textContent = output;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
